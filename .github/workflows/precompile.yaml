on:
  push:
    branches: [main]

name: Precompile Binaries

jobs:
  Precompile:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # - macOS-latest
          # - windows-latest
    steps:
      - uses: actions/checkout@v2
      - uses: dart-lang/setup-dart@v1
      - name: Install GTK
        if: (matrix.os == 'ubuntu-latest')
        run: sudo apt-get update && sudo apt-get install libgtk-3-dev
      # - name: Precompile
      #   if: (matrix.os == 'macOS-latest') || (matrix.os == 'windows-latest')
      #   run: dart run build_tool precompile-binaries -v --manifest-dir=../../../rust/ --repository=asqarslanov/rfb
      #   working-directory: trails_mobile/rust_builder/cargokit/build_tool/
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}
      - name: Precompile (with Android)
        if: (matrix.os == 'ubuntu-latest')
        run: dart run build_tool precompile-binaries -v --manifest-dir=../../../rust/ --repository=asqarslanov/rfb --android-sdk-location=/usr/local/lib/android/sdk --android-ndk-version=27.2.12479018 --android-min-sdk-version=29
        working-directory: trails_mobile/rust_builder/cargokit/build_tool/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}
